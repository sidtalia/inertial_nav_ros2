# Static earth->local alignment for non-earth-aligned cuVSLAM poses.
# cuVSLAM odometry still uses header.frame_id "odom"; we treat that VO frame as "local".
/**:
  ros__parameters:
    earth_frame: earth
    vslam_local_frame: local
    vslam_odom_topic: /visual_slam/tracking/odometry
    imu_topic: /zed/zed_node/imu/data
    mag_topic: /zed/zed_node/imu/mag
    mag_declination_deg: 15.5
