# EKF sim profile matching ekf_zed_vslam fusion (pose init-only, body odom + baro).
nav_filter_ekf:
  ros__parameters:
    use_sim_time: true
    executor_threads: 2
    pose_z_is_down: true
    body_axes: mujoco_enu
    max_transport_delay_ms: 500
    output_frame: map
    child_frame: base_link

    ext_nav_origin:
      lat: 45.0
      lon: -122.0
      hgt: 0.0

    enable:
      pose_src1: true
      pose_src2: false
      odom_src1: true
      odom_src2: false
      mag_src1: false
      mag_src2: false
      baro: true

    topics:
      imu: /sim/imu
      pose_src1: /sim/unused_pose
      pose_src1_odom: /sim/ext_nav/odom
      pose_src2: /sim/unused_pose2
      pose_src2_odom: ""
      odom_src1: ""
      odom_src1_odom: /sim/ext_nav/odom
      odom_src2: /sim/unused_odom2
      odom_src2_odom: ""
      mag_src1: /sim/mag
      mag_src2: /sim/unused_mag2
      baro: /sim/baro
      baro_pressure: ""

    pose_src1:
      delay_ms:
        pos: 100
        yaw: 100
        vel: 100
      fuse_height: false
      fuse_yaw: false
      fuse_vel: false
      fuse_pos: false
      max_rate_hz: 10.0

    odom_src1:
      delay_ms: 30
      max_rate_hz: 10.0

    baro:
      delay_ms: 50
      max_rate_hz: 10.0
      default_sigma: 1.0
