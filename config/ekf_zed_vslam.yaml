# EKF INS: ZED IMU + Isaac cuVSLAM visual odometry.
# Launch with hound_core when ekf.enabled is true (camera.backend: zed).
#
# Fusion profile:
#   - Init attitude from ZED IMU accel+mag (nav_filter AHRS / InitialiseFilter).
#   - extnav_earth_align_node publishes static earth->local from first VSLAM vs AHRS.
#   - cuVSLAM pose fused in earth frame after TF alignment (pose_src1).
#   - Ongoing: IMU strapdown + body velocity from cuVSLAM + mag yaw + baro.
#   - With mag_src1 disabled, imu_ahrs init uses accel tilt only (yaw=0 until pose fusion).

nav_filter_ekf:
  ros__parameters:
    use_sim_time: false
    executor_threads: 2

    pose_z_is_down: true
    body_axes: ros_flu
    max_transport_delay_ms: 500
    output_frame: earth
    child_frame: zed_camera_link
    init_reference: ext_nav

    ext_nav_origin:
      lat: 47.6080
      lon: -122.3352
      hgt: 0.0

    enable:
      pose_src1: true
      pose_src2: false
      odom_src1: true
      odom_src2: false
      mag_src1: false
      mag_src2: false
      baro: false

    topics:
      imu: /zed/zed_node/imu/data
      pose_src1: pose_src1
      pose_src1_odom: /visual_slam/tracking/odometry
      pose_src2: pose_src2
      pose_src2_odom: ""
      odom_src1: ""
      odom_src1_odom: /visual_slam/tracking/odometry
      odom_src2: odom_src2
      odom_src2_odom: ""
      mag_src1: /zed/zed_node/imu/mag
      mag_src2: mag_src2
      baro: baro
      baro_pressure: /zed/zed_node/atm_press

    pose_src1:
      delay_ms:
        pos: 30
        yaw: 30
        vel: 30
      extnav_not_earth_aligned: true
      earth_frame: earth
      vslam_local_frame: local
      extnav_tf_timeout_s: 6.0
      fuse_height: true
      fuse_yaw: true
      fuse_vel: false
      fuse_pos: true
      max_rate_hz: 10.0

    odom_src1:
      delay_ms: 30
      max_rate_hz: 10.0
      max_body_vel_mps: 8.0

    mag_src1:
      delay_ms: 50
      max_rate_hz: 10.0

    baro:
      delay_ms: 50
      max_rate_hz: 10.0
      default_sigma: 1.0
      sea_level_pressure_pa: 101325.0
